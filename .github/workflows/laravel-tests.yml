name: Laravel backend tests

on:
  push:
    branches:
      - feature/admin-user-live-ops-2026
      - feature/payment-error-monitoring-and-admin-js-fixes
  pull_request:
    branches:
      - main
      - feature/admin-user-live-ops-2026

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: final-game
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: final-game
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, mysqli, pdo_mysql, xml, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan migrate --force
      - name: Run payment monitoring tests
        run: php artisan test tests/Unit/PaymentAlertRecorderTest.php tests/Feature/PaymentAlertPersistenceTest.php
      - name: Validate bid and chat PHP syntax
        run: |
          php -l app/Http/Controllers/Backend/Game/BiddingDeskController.php
          php -l app/Services/BidAnalyticsService.php
          php -l app/Http/Controllers/Backend/SupportChatController.php
          php -l app/Events/SupportMessageCreated.php
          php -l tests/Feature/AdminBidAndSupportChatEnhancementTest.php
      - name: Run bid and chat regression tests
        run: php artisan test tests/Feature/AdminBidAndSupportChatEnhancementTest.php
      - name: Run complete Laravel test suite
        run: php artisan test
