name: Focused Laravel regression tests

on:
  pull_request:
    branches:
      - main

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: final-game
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: final-game
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, mysqli, pdo_mysql, xml, zip
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Compile Admin Blade views
        run: php artisan view:cache
      - name: Check changed backend PHP files
        run: |
          php -l app/Http/Controllers/Api/PresenceController.php
          php -l app/Http/Controllers/Backend/User/UserController.php
          php -l app/Services/Admin/UserBidActivityService.php
          php -l app/Services/Admin/GameResultSettlementService.php
          php -l app/Http/Controllers/Backend/Game/ResultController.php
          php -l tests/Feature/AdminBidAndSupportChatEnhancementTest.php
          php -l app/Http/Controllers/Backend/SupportChatController.php
          php -l routes/admin.php
          php -l routes/api.php
          php -l routes/channels.php
      - name: Run focused bid, chat and channel regression tests
        run: php artisan test tests/Feature/AdminBidAndSupportChatEnhancementTest.php --display-warnings
